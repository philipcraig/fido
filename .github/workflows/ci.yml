name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run before it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to the commit of the release named beside each. The tools
# come from .github/ci/package-lock.json.
jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci --prefix .github/ci
      - run: .github/ci/node_modules/.bin/prettier --check .

  test:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # The tests import 'claude-code/testing', which ships in the Claude Code CLI
      - run: npm ci --prefix .github/ci
      - run: .github/ci/node_modules/.bin/claude plugin validate .
      - run: .github/ci/node_modules/.bin/claude plugin test

  # Audits the workflows and Dependabot's config with zizmor, at its strictest
  # persona. Findings show as annotations on the pull request.
  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          persona: pedantic
          advanced-security: false
          annotations: true

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci --prefix .github/ci
      # Claude Code writes the plugin API's types to .claude-plugin/types as it
      # loads the plugin, before it calls the API. So start it with a key that
      # can't work, against an address where nothing listens, and stop it once
      # the types are there.
      - name: Write the plugin API's types
        run: |
          ANTHROPIC_API_KEY=unused ANTHROPIC_BASE_URL=http://127.0.0.1:9 \
            .github/ci/node_modules/.bin/claude -p 'Load the plugin' --plugin-dir . > /dev/null 2>&1 &
          for _ in $(seq 60); do
            [ -f .claude-plugin/types/tsconfig.json ] && [ -f .claude-plugin/types/claude-code/index.d.ts ] && break
            sleep 0.5
          done
          # Let it finish writing them
          sleep 1
          kill %1 || true
          test -f .claude-plugin/types/claude-code/index.d.ts
      - run: .github/ci/node_modules/.bin/tsc -p .
