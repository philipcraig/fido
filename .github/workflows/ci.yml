name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx --yes prettier@3.8.1 --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The tests import 'claude-code/testing', which ships in the Claude Code CLI
      - run: npm install --global @anthropic-ai/claude-code@2.1.289
      - run: claude plugin validate .
      - run: claude plugin test
